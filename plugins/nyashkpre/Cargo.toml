[package]
name = "nyashkpre"
description = "NyashkPre - vocal preamp and saturator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
nyashk_common = { path = "../../crates/common" }

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "nyashkpre"
path = "src/main.rs"
required-features = ["standalone"]
